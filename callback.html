<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Authorization Complete</title>
<style>
  body { margin: 0; background: #faf8f5; color: #1f1b17; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 0 20px; }
  main { max-width: 640px; margin: 0 auto; padding-block: 56px 80px; }
  h1 { font-size: 1.5rem; margin: 0 0 16px; }
  p { font-size: 1rem; line-height: 1.6; }
  code { display: block; background: #efe9e1; padding: 16px; border-radius: 6px; word-break: break-all; font-size: 0.95rem; margin-top: 12px; }
  .hint { color: #6b6258; font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <h1>Authorization complete</h1>
  <p>Copy the authorization code below:</p>
  <code id="code">(reading URL...)</code>
  <p class="hint">This page runs entirely in your browser — the code is never sent anywhere else.</p>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    document.getElementById("code").textContent = code || "No code found in URL — check the TikTok authorization step.";
  </script>
</main>
</body>
</html>
